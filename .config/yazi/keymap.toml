[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"

[[manager.prepend_keymap]]
on  = "<C-n>"
run = '''
  shell 'ripdrag "$@" -x 2>/dev/null &' --confirm
'''

[[manager.prepend_keymap]]
on  = "M"
run = "plugin mount"

[[manager.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Smart filter"

[[manager.prepend_keymap]]
on   = "<C-s>"
run  = 'shell "$SHELL" --block --confirm'
desc = "Open shell here"

[[manager.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/dumpster"
desc = "Cd to ~/dumpster"

[[manager.prepend_keymap]]
on   = [ "g", "s" ]
run  = "cd ~/.ssh"
desc = "Cd to ~/.ssh"

[[manager.prepend_keymap]]
on   = [ "g", "l" ]
run  = "cd ~/.local"
desc = "Cd to ~/.local"

[[manager.prepend_keymap]]
on   = [ "g", "a" ]
run  = "cd ~/.cache"
desc = "Cd to ~/.cache"

[[manager.prepend_keymap]]
on   = [ "g", "o" ]
run  = "cd ~/deckenburg/osna"
desc = "Cd to ~/deckenburg/osna"
