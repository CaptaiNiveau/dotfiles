input {
    kb_model = pc105awide
    kb_layout = us
    kb_variant = cmk_ed_us
    kb_options = misc:extend, lv5:caps_switch_lock, grp:shifts_toggle, compose:menu, misc:cmk_curl_dh 
    
    repeat_rate = 70
    repeat_delay = 150

    kb_file =
    kb_rules = evdev

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        disable_while_typing = no
        clickfinger_behavior = yes
    }

    sensitivity = 0.0 # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in = 5
    gaps_out = 15
    border_size = 2
    col.active_border = rgba(8822bbff) rgba(2222bbff) 30deg
    col.inactive_border = rgba(333333aa)

    allow_tearing = true
    #apply_sens_to_raw = 0 # whether to apply the sensitivity to raw input (e.g. used by games where you aim using your mouse)

    # damage_tracking = full # leave it on full unless you hate your GPU and want to make it suffer
}

#windowrulev2 = noborder, onworkspace:w[t1]
#windowrulev2 = dimaround, class:^(kitty-.*term)$
#windowrulev2 = noborder, focus:0
#windowrulev2 = noshadow, focus:0

cursor {
    inactive_timeout = 1
}

xwayland {
  force_zero_scaling = true
}

decoration {
    rounding = 10
    blur {
        size = 3 # minimum 1
        passes = 3 # minimum 1
        new_optimizations = 1
        brightness = 0.7
        contrast = 1.3
        # vibrancy = 0.2
        ignore_opacity = true
    }
    shadow {
	color = 0xbb1a0a1a
	color_inactive = 0x881a1a1a
	range = 20
	render_power = 2
    }
    dim_inactive = true
    dim_strength = 0.1
    #inactive_opacity = 0.9
    dim_special = 0.2
}

bezier=slow,0,0.85,0.3,1
bezier=overshot,0.7,0.6,0.1,1.1
bezier=bounce,1,1.6,0.1,0.85
bezier=slingshot,1,-2,0.9,1.25
bezier=nice,0,6.9,0.5,-4.20

animations {
    enabled=1
    #animation=windows,1,5,bounce,slide
    animation=windows,1,5,overshot,slide
    animation=border,1,20,default
    animation=fade,1,5,default
    animation=workspaces,1,5,overshot,slide
}

dwindle {
    pseudotile = 0 # enable ps
    pseudotile=0 # enable pseudotiling on dwindle
    split_width_multiplier=1.25
    preserve_split = 1
}

gestures {
    workspace_swipe = true
    workspace_swipe_forever = true
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_distance = 200
    workspace_swipe_direction_lock = false
}

xwayland { 
    force_zero_scaling = true
}

misc {
    disable_splash_rendering = true
#    no_direct_scanout = false
    vrr = 0
    animate_manual_resizes = true
    enable_swallow = true
    swallow_regex = ^(Alacritty|kitty|footclient)$
    swallow_exception_regex = ^(wev)$
    focus_on_activate = true
}

binds {
  # pass_mouse_when_bound = false
}

debug {
  disable_logs = false
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

