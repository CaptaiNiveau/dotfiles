windowrule = workspace 4 silent, class:^(Spotify)$
windowrule = workspace 5 silent, class:^(firefox)$
windowrule = workspace 6 silent, class:^(signal)$
windowrule = workspace 6 silent, class:^(vesktop)$
windowrule = workspace 8 silent, class:^(openrgb)$
windowrule = workspace 9 silent, class:^(jetbrains-gateway)$
