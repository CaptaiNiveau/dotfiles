# example window rules
# for windows named/classed as abc and xyz
#windowrule = move 69 420, abc
#windowrule = size 420 69, abc
#windowrule = tile, xyz
#windowrule = float, abc
#windowrule = pseudo, abc

windowrule {
  name = windowrule-1
  workspace = 2 silent
  match:class = ^(jetbrains-client)$
}

windowrule {
  name = windowrule-2
  workspace = 3 silent
  match:class = ^(.*Godot Engine)$
}

windowrule {
  name = windowrule-3
  workspace = 4 silent
  match:class = ^(teams-for-linux)$
}

windowrule {
  name = windowrule-4
  workspace = 4 silent
  match:class = ^(spotify)$
}

windowrule {
  name = windowrule-5
  workspace = 5 silent
  match:class = ^(firefox)$
}

windowrule {
  name = windowrule-6
  workspace = 6 silent
  match:class = ^(signal)$
}

windowrule {
  name = windowrule-7
  workspace = 6 silent
  match:class = ^(vesktop)$
}

windowrule {
  name = windowrule-8
  workspace = 8 silent
  match:class = ^(openrgb)$
}

windowrule {
  name = windowrule-9
  workspace = 9 silent
  tile = on
  match:class = ^(jetbrains-gateway)$
}

