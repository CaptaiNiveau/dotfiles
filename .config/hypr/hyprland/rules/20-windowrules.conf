# float kitty based file picker
windowrule = float,class:^(term-file-picker)$
# float anki windows
windowrule = size 600 450, class:^(anki)$
windowrule = float, class:^(anki)$
# xwayland fixes
# rider issues
windowrule = nofocus, class:^(jetbrains-rider)$, title:^(win*.)$
windowrule = bordercolor rgb(EE4B2B), class:^(jetbrains-rider)$, title:^(win*.)$
# unity issues
#windowrule = opacity 0.8 0.8, class:^(Unity)$
windowrule = opaque, class:^(Unity)$
windowrule = move cursor -50% -50%, class:^(Unity)$, title:^(Color)$
