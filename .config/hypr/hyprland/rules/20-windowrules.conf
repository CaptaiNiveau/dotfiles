# float kitty based file picker
windowrule {
  name = windowrule-13
  float = on
  match:class = ^(term-file-picker)$
}

# float anki windows
windowrule {
  name = windowrule-14
  size = 600 450
  float = on
  match:class = ^(anki)$
}

# xwayland fixes
# rider issues
windowrule {
  name = windowrule-15
  no_focus = on
  border_color = rgb(EE4B2B)
  match:class = ^(jetbrains-rider)$
  match:title = ^(win*.)$
}

# unity issues
#windowrule = opacity 0.8 0.8, class:^(Unity)$
windowrule {
  name = windowrule-16
  opaque = on
  match:class = ^(Unity)$
}

windowrule {
  name = windowrule-17
  move = (cursor_x+(-(monitor_w*0.5))) (cursor_y+(-(monitor_h*0.5)))
  match:class = ^(Unity)$
  match:title = ^(Color)$
}

windowrule {
  name = windowrule-18
  move = (cursor_x+(-(monitor_w*0.5))) (cursor_y+(-(monitor_h*0.5)))
  match:class = ^(Unity)$
  match:title = ^(Select Texture)$
}

windowrule {
  name = windowrule-19
  move = (cursor_x+(-(monitor_w*0.5))) (cursor_y+(-(monitor_h*0.5)))
  match:class = ^(Unity)$
  match:title = ^(UnityEditor.Searcher.SearcherWindow)$
}

windowrule {
  name = windowrule-20
  move = (cursor_x+(-(monitor_w*0.5))) (cursor_y+(-(monitor_h*0.5)))
  match:class = ^(Unity)$
  match:title = ^(UnityEditor.AddComponent.AddComponentWindow)$
}

windowrule {
  name = windowrule-21
  move = (cursor_x+(-(monitor_w*0.5))) (cursor_y+(-(monitor_h*0.5)))
  match:class = ^(Unity)$
  match:title = ^(Select Sprite)$
}

