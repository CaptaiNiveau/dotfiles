#old flameshot
#set flameshot to floating
#windowrule = float, class:^(flameshot)$,title:^(flameshot)
windowrule {
  name = windowrule-10
  stay_focused = on
  rounding = 0
  border_size = 0
  fullscreen = on
  pin = on
  move = (0) (0)
  match:class = flameshot
  match:title = flameshot
}

windowrule {
  name = windowrule-11
  float = on
  match:class = flameshot
}


# make Emacs float
windowrule {
  name = windowrule-12
  float = on
  match:class = ^(Emacs)$
}


# flameshot multi-display fix
#windowrule = move 0 0,class:(flameshot),title:(flameshot)
#windowrule = pin,class:(flameshot),title:(flameshot)
#windowrule = fullscreenstate,class:(flameshot),title:(flameshot)
