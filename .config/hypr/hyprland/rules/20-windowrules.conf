#! Fix focus issues when dialogs are opened or closed
# windowrule = windowdance,class:^(jetbrains-.*)$,floating:1
#! Fix splash screen showing in weird places and prevent annoying focus takeovers
windowrule {
  name = windowrule-22
  center = on
  no_focus = on
  border_size = 0
  match:class = ^(jetbrains-.*)$
  match:title = ^(splash)$
  match:float = 1
}


# Try to fix weird rider issues
windowrule {
  name = windowrule-23
  tag = +jbpopup
  match:class = ^jetbrains-.+$
  match:float = 1
}

#windowrule = bordercolor rgb(EE4B2B), tag:jbpopup
windowrule {
  name = windowrule-24
  size = 1200 1600
  min_size = 1200 1600
  match:tag = jbpopup
}

#windowrule = persistentsize no, tag:jbpopup
#windowrule = tile, tag:jbpopup
#windowrule = stayfocused, tag:jbpopup
#windowrule = noinitialfocus, tag:jbpopup

#! Center popups/find windows
windowrule {
  name = windowrule-25
  center = on
  border_size = 0
  match:class = ^(jetbrains-.*)$
  match:title = ^( )$
  match:float = 1
}

#windowrule = stayfocused,class:^(jetbrains-.*)$,title:^( )$,floating:1
#! Disable window flicker when autocomplete or tooltips appear
windowrule {
  name = windowrule-26
  no_focus = on
  match:class = ^(jetbrains-.*)$
  match:title = ^(win.*)$
  match:float = 1le:^(win*.)$
}


# clipse tui clipboard manager
windowrule {
  name = windowrule-27
  float = on
  match:class = (clipse) # ensure you have a floating window class set if you want this behavior
}

windowrule {
  name = windowrule-28
  size = 1222 1252
  match:class = (clipse) # set the size of the window as necessary
}


windowrule {
  name = windowrule-29
  immediate = on
  match:class = ^(steam_app_1966720)$
}

windowrule {
  name = windowrule-30
  immediate = on
  match:class = ^(Minecraft.*)$
}

windowrule {
  name = windowrule-31
  immediate = on
  match:class = ^(steam_app_252950)$
}


