#### Autostarts with hot reloads ####
    # gBar
    exec-once = ls ~/.config/gBar/style.scss | uwsm app -- entr -pns "sass ~/.config/gBar/style.scss > ~/.config/gBar/style.css"
    exec-once = ls ~/.config/gBar/style.css ~/.config/gBar/config | uwsm app -- entr -nrs "systemctl --user restart gBar"
    
    # dunst
    exec-once = ls ~/.config/dunst/dunstrc | uwsm app -- entr -nrs "dunst"
    
    # pypr
    exec-once = pypr
    exec-once = ls ~/.config/hypr/pyprland.toml | uwsm app -- entr -nrs "pypr reload"
#### \Autostarts with hot reloads ####
