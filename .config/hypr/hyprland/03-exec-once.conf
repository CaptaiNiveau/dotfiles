#### Social ####
    exec-once = [noinitialfocus] uwsm app -- signal-desktop
    exec-once = [noinitialfocus] uwsm app -- teams-for-linux
    exec-once = [noinitialfocus] uwsm app -- vesktop
#### \Social ####


#### General ####
    exec-once = [noinitialfocus] uwsm app -- spotify
    exec-once = uwsm app -- firefox
#### \General ####


#### Background Services ####
    exec-once = uwsm app -- arrpc
    exec-once = uwsm app -- hyprpaper
    exec-once = uwsm app -- kdeconnectd


    #### Screenshots ####
        exec-once = uwsm app -- flameshot
        exec-once = uwsm app -- normcap --background-mode
    #### \Screenshots ####


    #### System ####
        exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
        exec-once = /usr/lib/polkit-kde-authentication-agent-1
        exec-once = hyprpm reload -n
    #### \System ####


    #### Clipboard ####
        exec-once = uwsm app -- copyq --start-server
